configuration:
  center_url:
    name: Platform address
    description: The IQ Autom8 platform. Change it only if IQ asks you to.
  pairing_code:
    name: Pairing code
    description: The 6 digits IQ generated for this home on the platform (valid for 15 minutes). It is cleared after pairing.
  weather_entity:
    name: Good morning — weather entity
    description: The weather.* entity for the forecast. Empty = the first one in the home.
  temp_sensor:
    name: Good morning — temperature sensor
    description: A sensor.* (for example, the one outside) that gives the current temperature. High and low still come from the forecast.
  satellite:
    name: Good morning — reserve voice device
    description: An assist_satellite.* that speaks the good morning when the speaker or its voice fails, or when there is no speaker.
  tts_voice:
    name: Good morning — voice (Portuguese)
    description: The voice id of the voice engine (for example, ElevenLabs). Also used in English when the English one is empty. Empty, with ElevenLabs the IQ default voice is used.
  tts_voice_en:
    name: Good morning — voice (English)
    description: The voice id for English.
  speaker_delay:
    name: Good morning — wait before speaking (s)
    description: Seconds before playing on the speaker (default 2). The automatic speech does not wait.
  speaker_wait:
    name: Good morning — wait for the speaker (s)
    description: Seconds to wait for an unavailable speaker to come back (default 8).
  speaker_busy:
    name: Good morning — speaker playing
    description: "interrupt: speak over the TV or music (default). voice: speak on the reserve voice device without interrupting."
  card_seconds:
    name: Good morning — cards on the panel (s)
    description: How long the cards stay on the panel (default 40).
  prepare_minutes:
    name: Good morning — prepare ahead (min)
    description: Minutes before the chosen time to prepare the good morning, so it is spoken at once (default 30; 0 = off).
  prepare_at:
    name: Good morning — prepare at (HH:MM)
    description: For a home without a chosen time that uses the iq_bom_dia event, the time to start preparing (default 06:00).
  greet_names:
    name: Good morning — greet by name
    description: On, greets the people at home by name. Empty or off (default), it says only "Good morning." and uses no names.
  trash_organic_days:
    name: Trash days
    description: The weekdays of the organic trash. On a marked day, every good morning ends with a reminder to take it out. Empty (default) means no reminder.
  trash_recycling_days:
    name: Recycling days
    description: The weekdays of the recyclable trash. On a marked day, every good morning ends with a reminder to take it out. Empty (default) means no reminder.
  voice_agent:
    name: Voice router — assistant by entity
    description: The conversation.* entity of Home Assistant that gets the requests that are not simple. Only the words of the request reach it. It does not know who is speaking or from which device. For an assistant that the integration Webhook Conversation uses today, fill in voice_agent_url instead. Never choose the router's own agent. Empty (default) = not used.
  voice_chat_agent:
    name: Voice router — chat assistant
    description: The conversation.* entity of Home Assistant that gets only the chat and general questions, instead of the IQ center's Claude. Only the words of the request reach it. It should NOT be able to control the house (turn off Control Home Assistant in it and expose no entities to it). Works only when voice_agent or voice_agent_url is filled in. If it does not answer, the request goes to the main assistant. Never choose the router's own agent. Empty (default) = the IQ center answers the chat (when the owner turns it on in the center), and if it does not, the main assistant does.
  voice_route:
    name: Voice router — mode
    description: "Works only when voice_agent or voice_agent_url is filled in (the router does not run without one). on: the platform decides where each request goes (default when empty). observe: everything goes to the assistant, but the platform is still asked and its decision is counted. off: everything goes to the assistant and the platform is never asked."
  voice_agent_url:
    name: Voice router — assistant by address
    description: The webhook address of the assistant the home used before. Type the same address as its old entry in the integration Webhook Conversation (http or https, with no user or password inside). The router hands over the request untouched, so the assistant keeps who is speaking and from which device. If this is filled in, voice_agent is not used. Empty (default) = not used.
  voice_agent_user:
    name: Voice router — assistant user
    description: The user for the address above, if the assistant asks for one. Type the same user as in the old entry. Empty (default) = no login.
  voice_agent_password:
    name: Voice router — assistant password
    description: The password for the address above. Type the same password as in the old entry. Empty (default) = none.
network:
  8098/tcp: "Voice router for Home Assistant (webhook-conversation). Not needed on the host: Home Assistant reaches it inside."
