configuration:
  center_url:
    name: Endereço da plataforma
    description: A plataforma IQ Autom8. Só mude se a IQ pedir.
  pairing_code:
    name: Código de pareamento
    description: Os 6 dígitos que a IQ gerou para esta casa na plataforma (vale 15 minutos). Some depois de parear.
  weather_entity:
    name: Bom dia — entidade do clima
    description: A entidade weather.* da previsão. Vazio = a primeira da casa.
  temp_sensor:
    name: Bom dia — sensor de temperatura
    description: Um sensor.* (por exemplo, o de fora) que dá a temperatura agora. Máxima e mínima continuam da previsão.
  satellite:
    name: Bom dia — aparelho de voz de reserva
    description: Um assist_satellite.* que fala o Bom dia quando o alto-falante ou a voz falham, ou quando não há alto-falante.
  tts_voice:
    name: Bom dia — voz (português)
    description: O id da voz no motor de voz (por exemplo, ElevenLabs). Vale também em inglês se a voz em inglês ficar vazia. Vazio, com a ElevenLabs vale a voz padrão da IQ.
  tts_voice_en:
    name: Bom dia — voz (inglês)
    description: O id da voz em inglês.
  speaker_delay:
    name: Bom dia — espera antes de falar (s)
    description: Segundos antes de tocar no alto-falante (padrão 2). A fala automática não espera.
  speaker_wait:
    name: Bom dia — espera pelo alto-falante (s)
    description: Segundos que espera o alto-falante voltar se estiver indisponível (padrão 8).
  speaker_busy:
    name: Bom dia — alto-falante tocando
    description: "interrupt: fala por cima da TV ou da música (padrão). voice: fala no aparelho de voz de reserva sem interromper."
  card_seconds:
    name: Bom dia — cartões no painel (s)
    description: Quanto tempo os cartões ficam no painel (padrão 40).
  prepare_minutes:
    name: Bom dia — preparar antes (min)
    description: Minutos antes do horário escolhido para preparar o Bom dia, para a fala sair na hora (padrão 30; 0 = desligado).
  prepare_at:
    name: Bom dia — preparar às (HH:MM)
    description: Numa casa sem horário escolhido que usa o evento iq_bom_dia, a hora de começar a preparar (padrão 06:00).
  greet_names:
    name: Bom dia — cumprimentar pelo nome
    description: Ligado, cumprimenta pelo nome de quem está em casa. Vazio ou desligado (padrão), fala só "Bom dia." e não usa nomes.
  trash_organic_days:
    name: Dias do lixo orgânico
    description: "Os dias da semana do lixo orgânico. Os dias são escritos em inglês: monday = segunda, tuesday = terça, wednesday = quarta, thursday = quinta, friday = sexta, saturday = sábado, sunday = domingo. Nos dias marcados, todo Bom dia termina com um lembrete para colocar o lixo para fora. Vazio (padrão): sem lembrete."
  trash_recycling_days:
    name: Dias do lixo reciclável
    description: "Os dias da semana do lixo reciclável. Os dias são escritos em inglês: monday = segunda, tuesday = terça, wednesday = quarta, thursday = quinta, friday = sexta, saturday = sábado, sunday = domingo. Nos dias marcados, todo Bom dia termina com um lembrete para colocar o lixo para fora. Vazio (padrão): sem lembrete."
  voice_agent:
    name: Roteador de voz — assistente por entidade
    description: A entidade conversation.* do Home Assistant que recebe os pedidos que não são simples. Só as palavras do pedido chegam a ela. Ela não sabe quem está falando nem de qual aparelho. Para um assistente que a integração Webhook Conversation usa hoje, preencha voice_agent_url. Nunca escolha o agente do próprio roteador. Vazio (padrão) = não é usada.
  voice_route:
    name: Roteador de voz — modo
    description: "Só vale quando voice_agent ou voice_agent_url está preenchida (sem uma delas o roteador não roda). on: a plataforma decide para onde vai cada pedido (padrão quando vazio). observe: tudo vai ao assistente, mas a plataforma ainda é consultada e a decisão é contada. off: tudo vai ao assistente e a plataforma nunca é consultada."
  voice_agent_url:
    name: Roteador de voz — assistente por endereço
    description: O endereço do webhook do assistente que a casa já usava. Digite o mesmo endereço da entrada antiga da integração Webhook Conversation (http ou https, sem usuário nem senha dentro). O roteador entrega o pedido sem mexer em nada, e o assistente continua sabendo quem está falando e de qual aparelho. Se esta opção estiver preenchida, voice_agent não é usada. Vazio (padrão) = não é usada.
  voice_agent_user:
    name: Roteador de voz — usuário do assistente
    description: O usuário do endereço acima, se o assistente pedir. Digite o mesmo usuário da entrada antiga. Vazio (padrão) = sem login.
  voice_agent_password:
    name: Roteador de voz — senha do assistente
    description: A senha do endereço acima. Digite a mesma senha da entrada antiga. Vazio (padrão) = nenhuma.
network:
  8098/tcp: "Roteador de voz para o Home Assistant (webhook-conversation). Não precisa abrir no aparelho: o Home Assistant chega por dentro."
